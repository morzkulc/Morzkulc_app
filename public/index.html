<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SKK Morzkulc</title>

  <!-- PWA: manifest i ikony -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32-v2.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16-v2.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180-v2.png" />

  <!-- PWA: meta dla iOS / Android -->
  <meta name="theme-color" content="#0b0f17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Morzkulc" />
  <meta name="description" content="Aplikacja SKK Morzkulc — sprzęt, rezerwacje, godzinki." />

  <!-- Handshake DNS+TLS do gstatic startuje dopiero po sparsowaniu
       firebase_client.js; preconnect przesuwa go na start dokumentu.
       securetoken: odświeżanie tokenu przez SDK. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://firebaseinstallations.googleapis.com" crossorigin />

  <!-- Arkusze ekranu startowego i logowania — blokujące pierwsze malowanie (muszą być).
       Arkusze modułowe (gear/km/godzinki/kurs, razem ~54 KB) ładowane są nieblokująco
       przez media="print" + onload: pobierają się równolegle od startu, ale nie
       opóźniają pierwszego malowania ekranu, na którym i tak nie są używane.
       Wszystkie zostają w <head>, więc żaden moduł nie ryzykuje renderu bez stylów. -->
  <link rel="stylesheet" href="/styles/base.css?v=3" />
  <link rel="stylesheet" href="/styles/dashboard.css?v=3" />
  <link rel="stylesheet" href="/styles/gear.css?v=3" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/styles/start.css?v=3" />
  <link rel="stylesheet" href="/styles/events.css?v=3" />
  <link rel="stylesheet" href="/styles/basen.css?v=3" />
  <link rel="stylesheet" href="/styles/km.css?v=3" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/styles/godzinki.css?v=3" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/styles/kurs.css?v=3" media="print" onload="this.media='all'" />
</head>
<body>
  <header>
    <div class="headerRow">
      <h1>SKK Morzkulc</h1>
      <div class="headerActions">
        <button id="themeToggle" class="iconBtn ghost" type="button" aria-label="Przełącz motyw">☀️</button>
        <button id="profileBtn" class="iconBtn ghost hidden" type="button" aria-label="Profil użytkownika">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <button id="loginBtn" type="button">Zaloguj</button>
        <button id="logoutBtn" class="hidden" type="button">Wyloguj</button>
      </div>
    </div>
    <div id="swUpdateBanner" class="swUpdateBanner hidden">
      <span>Dostępna nowa wersja aplikacji.</span>
      <button type="button" class="primary" id="swUpdateReloadBtn">Odśwież teraz</button>
    </div>
  </header>

  <!-- UWAGA: app_shell.js oczekuje appRoot -->
  <div id="appRoot" class="hidden">
    <div id="nav"></div>
    <div id="view"></div>
  </div>

  <!-- Pomiar startu — MUSI być pierwszym modułem. Osobny tag (nie import w
       app_shell.js) sprawia, że wykonuje się gdy tylko się pobierze, nie czekając
       na cały graf modułów — inaczej metryka kosztu tego grafu byłaby zawsze zerem. -->
  <script type="module" src="/core/perf.js"></script>

  <!-- Theme (UI only) -->
  <script type="module" src="/core/theme.js"></script>

  <!-- App entrypoint -->
  <script type="module" src="/core/app_shell.js"></script>
</body>
</html>
